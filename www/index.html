/* Layout: columna de teléfono (máx. 440px). Arriba el mapa-guía ilustrado del territorio, abajo la tarjeta de la próxima parada.
   Papel crema y verde Raíz, con el azul salobre del lago como segundo color. Modo anfitrión en tierra oscura. Un solo look, deliberado. */
:root{
  --verde:#4E6B3A; --verde-osc:#3E5A2D; --brote:#C7DA9C; --salvia:#E4EBD8;
  --lago:#5F8C93; --lago-claro:#C6D9D8; --lago-osc:#2F5C63;
  --crema:#F9F6EF; --lino:#EEE6DA; --borde:#E2D9CA; --tinta:#211F1A; --piedra:#7C7568;
  --tierra:#B4602F; --hoja:#D99A62; --rosa:#F3DED3;
  --noche:#22201B; --noche-2:#2D2A24; --noche-3:#3A362F; --noche-txt:#EDE7DB; --noche-mute:#A39C8E;
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:-apple-system,"Helvetica Neue",Roboto,"Segoe UI",Arial,sans-serif;
  --r:14px;
  color-scheme:light;
}
html,body{height:100%}
html{box-sizing:border-box}
body{margin:0;background:var(--lino);color:var(--tinta);font:15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tierra);outline-offset:2px}
p{margin:0}
a{color:inherit}

#app{position:relative;height:100%;max-width:440px;margin:0 auto;background:var(--crema);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px var(--borde)}
#app.dark{background:var(--noche);color:var(--noche-txt)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:24px}
.pad{padding-inline:20px}

.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--piedra);font-weight:500}
.dark .eyebrow{color:var(--noche-mute)}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:34px;line-height:1.02}
h2{font-size:28px;line-height:1.05}
h3{font-size:20px;line-height:1.15}
.mute{color:var(--piedra)}
.dark .mute{color:var(--noche-mute)}
.small{font-size:13px}
.xs{font-size:12px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 20px 12px}
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:rgba(249,246,239,.94);display:grid;place-items:center;flex:none;box-shadow:0 1px 3px rgba(33,31,26,.16)}
.iconbtn svg{width:20px;height:20px}
.chip{border:1px solid var(--borde);background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:var(--crema)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:4px 8px;border-radius:4px;background:var(--salvia);color:var(--verde-osc);white-space:nowrap}
.tag.lago{background:var(--lago-claro);color:var(--lago-osc)}
.tag.off{background:var(--lino);color:var(--piedra)}
.tag.ter{background:var(--rosa);color:var(--tierra)}

/* mapa */
.mapwrap{position:relative;background:#E7EBDC;height:430px;overflow:hidden;touch-action:manipulation}
.mapwrap svg.map{position:absolute;inset:0;width:100%;height:100%}
.maptop{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}
.maptop > *{pointer-events:auto}
.routebadge{background:rgba(249,246,239,.95);border-radius:12px;padding:8px 12px;box-shadow:0 1px 3px rgba(33,31,26,.14);min-width:0}
.routebadge b{font-family:var(--serif);font-weight:400;font-size:18px;display:block;line-height:1.1}
.modebtn{border:0;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:600;background:var(--tinta);color:var(--crema);display:flex;align-items:center;gap:6px;flex:none}
.modebtn i{width:8px;height:8px;border-radius:50%;background:var(--hoja);display:inline-block}
.modebtn.gps i{background:#7FD07F}
.maphint{position:absolute;left:12px;bottom:34px;background:rgba(249,246,239,.94);padding:6px 10px;border-radius:8px;font-size:11.5px;color:var(--piedra);max-width:calc(100% - 24px)}
.stoppin{cursor:pointer}
.stoppin:focus-visible circle.ring{stroke:var(--tierra);stroke-width:3}
@keyframes pulse{0%{r:11;opacity:.7}100%{r:22;opacity:0}}
.pulse{animation:pulse 1.6s ease-out infinite}
@keyframes here{0%{r:8;opacity:.5}100%{r:26;opacity:0}}
.mehalo{animation:here 2s ease-out infinite}

/* tarjeta próxima parada */
.next{margin:-22px 12px 0;position:relative;background:var(--crema);border-radius:18px;padding:16px;box-shadow:0 -1px 0 var(--borde),0 6px 20px rgba(33,31,26,.08);display:grid;gap:10px}
.next.here{background:var(--verde);color:var(--crema)}
.next.here .mute,.next.here .eyebrow{color:#DCE6CC}
.nextrow{display:flex;gap:12px;align-items:center}
.nextnum{width:40px;height:40px;border-radius:50%;background:var(--tierra);color:#fff;font-family:var(--serif);font-size:20px;display:grid;place-items:center;flex:none}
.next.here .nextnum{background:var(--crema);color:var(--verde-osc)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:12px;background:var(--verde-osc);color:var(--crema);padding:13px 16px;font-weight:600;font-size:15px;text-align:center;text-decoration:none;min-width:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;border:1px solid var(--borde);color:var(--tinta)}
.btn.light{background:var(--crema);color:var(--verde-osc)}
.btn.brote{background:var(--brote);color:var(--noche)}
.btn.lago{background:var(--lago-osc)}
.next.here .btn.ghost{border-color:rgba(249,246,239,.4);color:var(--crema)}
.dark .btn.ghost{border-color:var(--noche-3);color:var(--noche-txt)}

/* listas de paradas */
.stoplist{display:grid;padding:4px 20px 0}
.srow{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border:0;border-bottom:1px solid var(--borde);background:none;text-align:left;width:100%}

function meters(a,b){
  var A=toLL(a.x,a.y), B=toLL(b.x,b.y), R=6371000, r=Math.PI/180;
  var dLat=(B.lat-A.lat)*r, dLng=(B.lng-A.lng)*r;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(A.lat*r)*Math.cos(B.lat*r)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(h));
}

  return Math.max(2,Math.round(m*1.35/1000/40*60))+' min en auto';
}

/* postal ilustrada de cada parada: cielo, cerros y agua, con el ícono de la parada como sello */
function postcard(s, h){
  h = h || 210;
  var k = s.n*1.7;
  function hill(base, amp, ph, col){
    var d='M0 '+base;
    for(var x=0;x<=400;x+=20){ var y=base - amp*(0.55+0.45*Math.sin(x/62+ph+k)) ; d+=' L'+x+' '+y.toFixed(1); }
    return '<path d="'+d+' L400 '+h+' L0 '+h+'Z" fill="'+col+'"/>';
  }
  var water = ['mirador','muelle','ruka','inicio','lawen'].indexOf(s.id)>=0;
  var sunX = 70 + (s.n*53)%260;
  return '<svg class="post" viewBox="0 0 400 '+h+'" aria-hidden="true"><defs><linearGradient id="sk'+s.n+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3E3CF"/><stop offset="1" stop-color="#F9F6EF"/></linearGradient></defs>'+
    '<rect width="400" height="'+h+'" fill="url(#sk'+s.n+')"/>'+
    '<circle cx="'+sunX+'" cy="'+(h*0.34)+'" r="24" fill="#E9B98A"/>'+
    hill(h*0.55, 26, 0.3, '#C9D6B4')+
    (water?'<rect y="'+(h*0.62)+'" width="400" height="'+(h*0.18)+'" fill="#C6D9D8"/><path d="M0 '+(h*0.68)+' q20 -5 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" stroke="#A9C3C3" fill="none"/>':'')+
    hill(h*(water?0.86:0.72), water?14:30, 1.9, '#8FA874')+
    hill(h*0.95, 12, 3.1, '#5E7B47')+
    '<g transform="translate(332 '+(h-58)+') rotate(-8)"><circle r="34" fill="#F9F6EF" stroke="#B4602F" stroke-width="2"/><circle r="28" fill="none" stroke="#B4602F" stroke-width="1" stroke-dasharray="2 3"/>'+
    '<g transform="translate(-15 -15) scale(1.25)" fill="none" stroke="#B4602F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+G[s.g]+'</g></g>'+
    '</svg>';
}

var CAP=window.Capacitor, NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
var stack=[{s:'route'}];
// La navegación vive en la propia app (sin historial del navegador): funciona igual en el visor, en el navegador y en el APK.
function cur(){ return stack[stack.length-1]; }
function go(s,p){ var e={s:s}; for(var k in p) e[k]=p[k]; stack.push(e); render(true); }
function popScreen(){ if(stack.length>1){ stack.pop(); render(true); } }
function back(){ if(closeOverlay()) return; popScreen(); }
if(NATIVE && CAP.Plugins && CAP.Plugins.App){
  CAP.Plugins.App.addListener('backButton',function(){
    if(closeOverlay()) return;

    var home=S.role==='anfitrion'?'hostToday':'route';
    if(S.role && stack[0].s!==home){ tab(home); return; }
    CAP.Plugins.App.exitApp();
  });
}
function tab(s){ stack=[{s:s}]; render(true); }
function pushOverlay(){}
function closeOverlay(){

}

/* ===================== Render ===================== */
var app=document.getElementById('app'), view=document.getElementById('view'), bottom=document.getElementById('bottom');
var mem={};
function render(fresh){
  var c=cur(), key=c.s+(c.id||'');
  if(!fresh) mem[key]=view.scrollTop;
  app.classList.toggle('dark', S.role==='anfitrion');
  if(S.role==='anfitrion' && REMOTE && !HOST_STOP && /^host(Today|Offers|Profile)$/.test(c.s)){ stack=[{s:'hostPending'}]; c=cur(); }
  if(S.role==='anfitrion' && !REMOTE && c.s==='hostPending'){ stack=[{s:'hostToday'}]; c=cur(); }
  var out=(SCREENS[c.s]||SCREENS.route)(c);
  view.innerHTML=out.html;
  bottom.innerHTML = out.bottom!=null ? out.bottom : tabsHtml();
  view.scrollTop = fresh?0:(mem[key]||0);
  if(out.after) out.after();
  if(!S.role) welcome();
  barStyle(S.role==='anfitrion' || !S.role);
}
function rerender(){ var y=view.scrollTop; render(false); view.scrollTop=y; }
function barStyle(dark){ if(!NATIVE||!CAP.Plugins||!CAP.Plugins.SystemBars) return; try{ var r=CAP.Plugins.SystemBars.setStyle({style:dark?'DARK':'LIGHT'}); if(r&&r.catch) r.catch(function(){}); }catch(e){} }

function bindMap(){

/* --- movimiento simulado --- */
var anim=null;
function moveTo(target, ms){
  var from={x:S.pos.x,y:S.pos.y}, t0=performance.now();
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) ms=0;
  cancelAnimationFrame(anim);
  function step(t){
    var k=ms?Math.min(1,(t-t0)/ms):1, e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    S.pos={x:from.x+(target.x-from.x)*e, y:from.y+(target.y-from.y)*e};
    var g=document.querySelector('#mapsvg g[aria-hidden="true"]');
    if(g){ g.setAttribute('transform','translate('+S.pos.x+' '+S.pos.y+')'); }
    if(k<1){ anim=requestAnimationFrame(step); } else { anim=null; save(); positionChanged(); }
  }
  anim=requestAnimationFrame(step);
}
function positionChanged(){
  var h=here();
  if(h && !S.visited[h.id]){ S.visited[h.id]=Date.now(); save(); if(signedIn()) rpc('mark_visit',{p_stop:h.id}).catch(function(){}); if(cur().s==='route'||cur().s==='stop'||cur().s==='stops') rerender(); arrival(h); return; }
  if(cur().s==='route'||cur().s==='stop'||cur().s==='stops') rerender();
}

/* --- GPS real (en el APK o en navegadores que lo permitan) --- */
var watchId=null;
function startGps(){
  if(!navigator.geolocation){ gpsFail('Este dispositivo no entrega ubicación. Sigues en modo simulación.'); return; }
  S.gpsMsg='Buscando tu ubicación…';
  try{
    watchId=navigator.geolocation.watchPosition(function(p){
      S.pos=fromLL(p.coords.latitude,p.coords.longitude);
      var inMap = S.pos.x>=0&&S.pos.x<=400&&S.pos.y>=0&&S.pos.y<=440;
      var d0=meters(S.pos, STOPS[0]);
      S.gpsMsg = inMap ? 'Ubicación real · precisión '+Math.round(p.coords.accuracy)+' m' : 'Estás a '+fmtDist(d0)+' del inicio de la ruta.';
      save(); positionChanged();
    }, function(err){
      gpsFail(err && err.code===1 ? 'No diste permiso de ubicación. Sigues en modo simulación.' : 'No se pudo obtener tu ubicación en esta vista. Sigues en modo simulación.');
    }, {enableHighAccuracy:true, maximumAge:10000, timeout:15000});
  }catch(e){ gpsFail('No se pudo obtener tu ubicación en esta vista. Sigues en modo simulación.'); }
}
function stopGps(){ if(watchId!=null){ try{navigator.geolocation.clearWatch(watchId);}catch(e){} watchId=null; } }
function gpsFail(msg){ stopGps(); S.mode='sim'; if(!S.pos||S.pos.x<0||S.pos.x>400||S.pos.y<0||S.pos.y>440) S.pos={x:372,y:276}; save(); rerender(); toast(msg); }

function attend(id){

  if(!REMOTE) return '<div class="pad" style="display:grid;gap:8px;margin-top:22px"><button class="btn ghost" data-act="tohost">Entrar como anfitrión</button><button class="btn ghost" data-act="reset">Reiniciar recorrido de ejemplo</button></div>'+
    '<p class="note">Modo demostración: lo que haces se guarda solo en este teléfono.</p>';
  if(!ME) return '<div class="sec"><h3>Tu cuenta</h3></div><div class="empty" style="display:grid;gap:10px"><span>Entra o crea tu cuenta para reservar, pagar y guardar tus sellos.</span><button class="btn" data-act="login">Entrar o crear cuenta</button></div>'+
    '<div class="pad" style="margin-top:12px"><button class="btn ghost" style="width:100%" data-act="tohost">Soy anfitrión</button></div>';
  return '<div class="sec"><h3>Tu cuenta</h3></div><div class="pad"><div class="ticket" style="gap:4px"><b class="small">'+esc(ME.name||'Sin nombre')+'</b><span class="xs mute">'+esc(ME.email||'')+'</span></div></div>'+
    '<div class="pad" style="display:grid;gap:8px;margin-top:10px">'+(ME.role==='admin'?'<button class="btn" data-act="admin">Panel de la red</button>':'')+
    '<button class="btn ghost" data-act="tohost">'+(HOST_STOP?'Entrar como anfitrión':'Soy anfitrión')+'</button>'+
    '<button class="btn ghost" data-act="logout">Cerrar sesión</button><button class="link-btn" style="justify-self:center;color:#A33A22" data-act="delaccount">Eliminar mi cuenta</button></div>'+
    (OFFLINE?'<p class="note">Sin conexión: estás viendo la última versión guardada.</p>':'');
}

/* --- Bienvenida --- */
function welcome(){
  if(document.querySelector('.welcome')) return;
  app.insertAdjacentHTML('beforeend','<section class="welcome" aria-label="Bienvenida"><div class="art">'+welcomeArt()+'</div><div class="in"><div style="display:grid;gap:14px">'+
    '<div class="brand"><span style="width:32px;height:32px;color:var(--crema);display:block">'+SPROUT+'</span><div><div class="wm">Raíz</div><div class="tg">rutas del territorio</div></div></div>'+
    '<h1>Recorre el territorio y compra donde nace</h1><p class="lead">Una guía en tu teléfono que te lleva parada por parada. Al llegar, conoces a quien produce y compras ahí mismo.</p></div>'+
    '<div class="pick"><button data-role="visitante"><b>Voy a recorrer</b><span>'+ROUTE.name+' · '+STOPS.length+' paradas</span></button>'+
    '<button class="alt" data-role="anfitrion"><b>Soy anfitrión</b><span>Recibe visitas, valida reservas y vende en tu lugar</span></button>'+
    '<p class="xs" style="opacity:.7">'+(REMOTE?'Piloto · pagos en modo prueba':'Modo demostración · datos de ejemplo')+'</p></div></div></section>');
}

    '<rect y="132" width="400" height="22" fill="#5F8C93"/><path d="M0 140 q20 -5 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" stroke="#7FA5AB" fill="none"/>'+
    '<path d="M0 160 C 80 146, 160 152, 240 160 S 360 150, 400 156 V190 H0Z" fill="#3E5A2D"/>'+
    '<g transform="translate(96 108)" fill="none" stroke="#F9F6EF" stroke-width="2" stroke-linejoin="round"><path d="M-20 22 0 -10l20 32z"/><path d="M-4 22v-9h8v9"/></g>'+
    '<path d="M200 128 C 230 118, 262 126, 290 120" stroke="#F9F6EF" stroke-width="1.6" stroke-dasharray="3 5" fill="none"/>'+

/* ===================== Eventos ===================== */
app.addEventListener('submit',function(e){
  if(e.target.id==='authf'){ e.preventDefault(); doAuth(e.target); }
  if(e.target.id==='reqf'){ e.preventDefault(); var w=document.getElementById('r-wants').value.trim(), er=document.getElementById('r-err');
    if(!w){ er.textContent='Cuéntanos qué emprendimiento o parada representas.'; return; }
    rpc('request_host',{p_wants:w}).then(function(p){ ME=p; rerender(); toast('Solicitud enviada a la red'); }).catch(function(x){ er.textContent=errMsg(x); }); }
});
app.addEventListener('click',function(e){
  var t=e.target.closest('button,a,[data-act]'); if(!t) return;
  var d=t.dataset;
  if(d.act==='scrim' && e.target!==t) return;
  if(t.tagName==='A') return;
  if(d.role){
    var w=document.querySelector('.welcome'); if(w) w.remove();
    if(d.role==='anfitrion'){ if(REMOTE && !ME){ S.role='visitante'; save(); tab('route'); needLogin(enterHost,{mode:'signup',host:true}); } else enterHost(); return; }
    S.role='visitante'; save(); tab('route'); return;
  }
  if(d.authmode){ var keepNext=pendingAfterLogin; openAuth({mode:d.authmode, host:d.host==='1'}); pendingAfterLogin=keepNext; return; }
  if(d.day){ draft.day=d.day; draft.error=null; var od=offer(draft.id).o; if(REMOTE){ sheetOffer(); loadUsage(od.id,d.day).then(function(){ if(draft&&draft.day===d.day){ draft.slot=firstFreeSlot(od); sheetOffer(); } }); } else { draft.slot=firstFreeSlot(od); sheetOffer(); } return; }
  if(d.review){ var note=document.getElementById('note-'+d.review); t.disabled=true;
    rpc('admin_review_offer',{p_offer:d.review, p_ok:d.ok==='1', p_note:note?note.value:''}).then(function(){ toast(d.ok==='1'?'Experiencia publicada':'Se avisó que no fue aprobada'); return Promise.all([loadAdmin(), reloadRoute()]); }).catch(function(e){ t.disabled=false; toast(errMsg(e)); });
    return; }
  if(d.assign){ var sel=document.getElementById('sel-'+d.assign); t.disabled=true;
    rpc('admin_assign_host',{p_user:d.assign, p_stop:sel.value}).then(function(){ toast('Anfitrión activado'); return Promise.all([loadAdmin(), reloadRoute()]); }).catch(function(e){ t.disabled=false; toast(errMsg(e)); });
    return; }
  if(d.tab){ closeOverlay(false); tab(d.tab); return; }
  if(d.stop){ closeOverlay(false); go('stop',{id:d.stop}); return; }
  if(d.offer){ openOffer(d.offer); return; }
  if(d.slot){ draft.slot=d.slot; draft.error=null; sheetOffer(); return; }
  if(d.q){ var r=offer(draft.id), o=r.o, max=o.slots?o.cap-used(o,draft.slot,draft.day):10; draft.qty=Math.max(1,Math.min(max,draft.qty+parseInt(d.q,10))); sheetOffer(); return; }
  if(d.method){ draft.method=d.method; sheetOffer(); return; }
  if(d.attend){ attend(d.attend); return; }
  if(d.paymode){ draft.payMode=d.paymode; sheetOffer(); return; }
  if(d.cancelbk){ cancelSheet(d.cancelbk); return; }
  if(d.editexp){ openExpEditor(d.editexp); return; }
  if(d.toggleoffer){
    if(REMOTE){ var to=offer(d.toggleoffer).o, nv=!offerOn(to); rpc('set_offer_active',{p_offer:to.id, p_active:nv}).then(function(){ to.active=nv; rerender(); }).catch(function(e){ toast(errMsg(e)); }); return; }
    S.off[d.toggleoffer]=!S.off[d.toggleoffer]; save(); rerender(); return; }
  switch(d.act){
    case 'back': back(); break;
    case 'scrim': case 'closesheet': closeOverlay(false); if(cur().s==='stop'||cur().s==='trip') rerender(); break;
    case 'closearrive': closeOverlay(false); break;
    case 'arrivego': closeOverlay(false); go('stop',{id:d.id}); break;
    case 'openstop': closeOverlay(false); go('stop',{id:d.id}); break;
    case 'topay':
      if(REMOTE && !ME){ var dk=draft; needLogin(function(){ draft=dk; openSheet(''); if(draft.method==='efectivo'){ sheetOffer(); confirmDraft(); } else { draft.step='pay'; sheetOffer(); } }); break; }
      draft.error=null;
      if(draft.method==='efectivo'){ confirmDraft(); } else { draft.step='pay'; sheetOffer(); } break;
    case 'paybackstep': draft.step='form'; sheetOffer(); break;
    case 'paynow': if(draft.processing) break; draft.processing=true; sheetOffer(); setTimeout(confirmDraft, 1200); break;
    case 'docancel': {
      if(REMOTE){ t.disabled=true; rpc('cancel_booking',{p_id:d.id}).then(function(nb){ S.orders=S.orders.map(function(x){ return x.id===nb.id?nb:x; }); save(); closeOverlay(); rerender(); toast('Reserva cancelada · devolución '+clp(nb.refund)); }).catch(function(e){ t.disabled=false; toast(errMsg(e)); }); break; }
      var bk=S.orders.filter(function(x){return x.id===d.id;})[0]; if(bk){ bk.status='cancelada'; bk.refund=parseInt(d.refund,10)||0; save(); } closeOverlay(); rerender(); toast('Reserva cancelada · devolución '+clp(parseInt(d.refund,10)||0)); break; }
    case 'propose': openExpEditor(null); break;
    case 'advance': { var nx=nextStop(); if(!nx) break; var h=here(); if(h&&!S.visited[nx.id]&&h.id===nx.id) break; moveTo({x:nx.x+1.5,y:nx.y+1.5}, 1400); break; }
    case 'teleport': { var s=stop(d.id); closeOverlay(false); if(S.mode!=='sim'){ break; } if(cur().s!=='route') { stack=[{s:'route'}]; render(true); } moveTo({x:s.x+1.5,y:s.y+1.5}, 900); break; }
    case 'mode':
      if(S.mode==='sim'){ S.mode='gps'; save(); rerender(); startGps(); }
      else { stopGps(); S.mode='sim'; if(S.pos.x<0||S.pos.x>400||S.pos.y<0||S.pos.y>440) S.pos={x:372,y:276}; save(); rerender(); toast('Modo simulación'); }
      break;
    case 'toggleopen':
      if(REMOTE){ var hs=stop(HOST_STOP), nv2=!isOpen(hs); rpc('set_stop_open',{p_open:nv2}).then(function(){ hs.isOpen=nv2; rerender(); toast(nv2?'Tu parada aparece abierta':'Tu parada aparece cerrada'); }).catch(function(e){ toast(errMsg(e)); }); break; }
      S.closed[HOST_STOP]=!S.closed[HOST_STOP]; save(); rerender(); toast(isOpen(stop(HOST_STOP))?'Tu parada aparece abierta':'Tu parada aparece cerrada'); break;
    case 'tohost': if(REMOTE && !ME){ needLogin(enterHost,{mode:'login',host:true}); break; } enterHost(); break;
    case 'hostlogin': needLogin(enterHost,{mode:'signup',host:true}); break;
    case 'login': needLogin(null,{mode:'login'}); break;
    case 'logout': logout(); break;
    case 'refreshhost': loadHost().then(function(){ rerender(); toast('Actualizado'); }).catch(function(e){ toast(errMsg(e)); }); break;
    case 'refreshme': loadMe().then(reloadRoute).then(function(){ if(HOST_STOP) enterHost(); else { rerender(); toast('Tu solicitud sigue en revisión'); } }).catch(function(e){ toast(errMsg(e)); }); break;
    case 'admin': ADMIN=null; go('admin'); loadAdmin(); break;
    case 'adminrefresh': ADMIN=null; rerender(); loadAdmin(); break;
    case 'delaccount':
      openSheet('<h3>Eliminar tu cuenta</h3><p class="small">Se borran tu cuenta, tus datos personales y tus sellos. Las reservas ya pagadas quedan registradas sin tu nombre para la contabilidad de la familia anfitriona. Esto no se puede deshacer.</p>'+
        '<span class="err" id="del-err" role="alert"></span><div class="btns"><button class="btn ghost" data-act="closesheet">Mantener mi cuenta</button><button class="btn" style="background:#A33A22" data-act="dodelete">Eliminar definitivamente</button></div>'); break;
    case 'dodelete': t.disabled=true; rpc('delete_my_account').then(function(){ return sb.auth.signOut().catch(function(){}); }).then(function(){ closeOverlay(); ME=null; S.me=null; HOSTDATA=null; HOST_STOP=null; S.orders=[]; S.visited={}; S.role='visitante'; save(); tab('route'); toast('Tu cuenta fue eliminada'); })
      .catch(function(e){ t.disabled=false; var de=document.getElementById('del-err'); if(de) de.textContent=errMsg(e); }); break;
    case 'totourist': S.role='visitante'; save(); tab('route'); break;
    case 'reset': try{localStorage.removeItem(KEY);}catch(x){} location.reload(); break;
  }
});

function start(){
  if(S.mode==='gps') startGps();
  render(true);
  if(toastLater){ toast(toastLater); toastLater=null; }
}
function boot(){
  if(window.supabase && window.supabase.createClient){
    try{ sb=window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, storageKey:'raiz-auth'}}); }catch(e){ sb=null; }
  }
  if(!sb){ applyOffers(); start(); return; }
  // con servidor: estado separado del modo demostración
  var keep={mode:S.mode,pos:S.pos,role:S.role};
  KEY='raiz-rutas-srv-v1'; var saved=load(); S=saved||fresh(); if(!saved){ S.mode=keep.mode; S.pos=keep.pos; S.role=keep.role; }
  REMOTE=true; HOST_STOP=null;
  view.innerHTML='<div class="loading"><span style="width:44px;height:44px;display:block;color:var(--verde)">'+SPROUT+'</span><span>Cargando la ruta…</span></div>'; bottom.innerHTML='';
  withTimeout(reloadRoute(), 9000).catch(function(){
    var c=cachedRoute();
    if(c){ loadRoute(c); OFFLINE=true; if(S.me){ ME=S.me; HOST_STOP=ME.stop||null; } toastLater='Sin conexión: estás viendo la última versión guardada.'; return; }
    REMOTE=false; sb=null; KEY='raiz-rutas-v1'; S=load()||fresh(); HOST_STOP='witral'; applyOffers();
    toastLater='No pudimos conectar con el servidor. Estás en modo demostración.';
  }).then(function(){
    if(!REMOTE) return;
    return withTimeout(sb.auth.getSession(),6000).then(function(r){ if(r&&r.data&&r.data.session) return loadMe().then(function(){ return reloadRoute().catch(function(){}); }); }).catch(function(){});
  }).then(start, start);
}
boot();
})();
</script>

</body></html>
