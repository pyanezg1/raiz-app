/* Layout: una sola columna de teléfono (máx. 440px), vista que se desplaza + barra inferior fija.
   Consumidor en papel crema; modo productor en tierra oscura, como en el pitch. Un solo look, deliberado. */
:root{
  --verde:#4E6B3A; --verde-osc:#3E5A2D; --brote:#C7DA9C; --salvia:#E4EBD8;
  --crema:#F9F6EF; --lino:#EEE6DA; --borde:#E2D9CA; --tinta:#211F1A; --piedra:#7C7568;
  --tierra:#B4602F; --hoja:#D99A62; --rosa:#F3DED3;
  --noche:#22201B; --noche-2:#2D2A24; --noche-3:#3A362F; --noche-txt:#EDE7DB; --noche-mute:#A39C8E;
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:-apple-system,"Helvetica Neue",Roboto,"Segoe UI",Arial,sans-serif;
  --r:14px; --r-s:10px;
  color-scheme:light;
}
html,body{height:100%}
html{box-sizing:border-box}
body{margin:0;background:var(--lino);color:var(--tinta);font:15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tierra);outline-offset:2px}
img{max-width:100%;display:block}

#app{position:relative;height:100%;max-width:440px;margin:0 auto;background:var(--crema);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px var(--borde)}
#app.dark{background:var(--noche);color:var(--noche-txt)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:24px}
.pad{padding-inline:20px}

/* tipografía */
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--piedra);font-weight:500}
.dark .eyebrow{color:var(--noche-mute)}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:34px;line-height:1.02}
h2{font-size:26px;line-height:1.08}
h3{font-size:20px;line-height:1.15}
.mute{color:var(--piedra)}
.dark .mute{color:var(--noche-mute)}
.small{font-size:13px}
.xs{font-size:12px}
.num{font-variant-numeric:tabular-nums}
p{margin:0}

/* encabezados */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 20px 10px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--lino);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--verde-osc);border:0;flex:none}
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:rgba(249,246,239,.92);display:grid;place-items:center;flex:none;box-shadow:0 1px 3px rgba(33,31,26,.14)}
.iconbtn svg{width:20px;height:20px}
.dark .iconbtn{background:var(--noche-2);color:var(--noche-txt);box-shadow:none}

/* búsqueda y chips */
.search{display:flex;align-items:center;gap:8px;background:var(--lino);border-radius:12px;padding:0 12px;margin:6px 20px 12px}
.search input{flex:1;border:0;background:none;padding:12px 0;outline:none;min-width:0}
.search svg{width:18px;height:18px;color:var(--piedra);flex:none}
.chips{display:flex;gap:8px;padding:0 20px 4px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--borde);background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:var(--crema)}

/* sellos */
.seals{display:flex;flex-wrap:wrap;gap:6px}
.seal{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:4px 8px;border-radius:4px;background:var(--salvia);color:var(--verde-osc)}
.seal.ic{background:var(--rosa);color:var(--tierra)}
.seal.pend{background:var(--lino);color:var(--piedra)}

/* tarjetas */
.feature{margin:16px 20px 0;border-radius:var(--r);overflow:hidden;background:var(--lino);border:0;padding:0;text-align:left;width:calc(100% - 40px);display:block}
.feature img{width:100%;aspect-ratio:16/8;object-fit:cover}
.feature .body{padding:12px 14px 14px;display:grid;gap:6px}
.feature .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sechead{display:flex;justify-content:space-between;align-items:baseline;padding:24px 20px 10px}
.link{border:0;background:none;color:var(--verde);font-size:13px;font-weight:600;padding:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:0 20px}
.pcard{border:0;background:none;padding:0;text-align:left;display:grid;gap:6px;min-width:0}
.pcard .ph{aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--lino)}
.pcard .ph img{width:100%;height:100%;object-fit:cover}
.pcard .nm{font-size:14px;font-weight:600;line-height:1.25}
.pcard .pr{font-size:13px}
.ph-empty{width:100%;height:100%;display:grid;place-items:center;align-content:center;gap:4px;color:var(--piedra);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:repeating-linear-gradient(135deg,var(--lino) 0 10px,#E8DFD1 10px 20px)}
.ph-empty svg{width:34px;height:34px;color:var(--verde)}
.empty{margin:20px;padding:22px;border-radius:var(--r);background:var(--lino);text-align:center;display:grid;gap:8px}

/* listas de productores */
.plist{display:grid}
.prow{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--borde);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.prow:first-child{border-top:0}
.prow.sel{background:var(--salvia)}
.prow .th{width:48px;height:48px;border-radius:10px;overflow:hidden;flex:none;background:var(--lino)}
.prow .th img{width:100%;height:100%;object-fit:cover}
.prow .tx{flex:1;min-width:0}
.prow .tx b{display:block;font-size:14px}
.pill-btn{border:1px solid var(--verde);color:var(--verde);background:none;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;flex:none}

/* mapa */
.map{position:relative;height:330px;overflow:hidden;background:#E9EDDF}
.map svg.base{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:0;background:transparent;padding:0;display:grid;place-items:center}
.pin i{width:16px;height:16px;border-radius:50%;background:var(--verde);border:3px solid var(--crema);box-shadow:0 1px 4px rgba(33,31,26,.35);transition:transform .15s}
.pin.coop i{background:var(--tierra)}
.pin.sel i{transform:scale(1.45)}
.pin.dim{opacity:.35}
.me{position:absolute;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#2F6FB0;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,111,176,.18)}
.map .mapsearch{position:absolute;top:12px;left:16px;right:16px;display:flex;gap:8px}
.map .mapsearch div{flex:1;background:rgba(249,246,239,.95);border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:0 1px 3px rgba(33,31,26,.12)}
.legend{position:absolute;left:16px;bottom:30px;display:flex;gap:12px;font-size:11px;background:rgba(249,246,239,.9);padding:6px 10px;border-radius:8px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--verde);display:inline-block}
.legend i.c{background:var(--tierra)}
.sheet-top{background:var(--crema);margin-top:-18px;position:relative;border-radius:18px 18px 0 0;padding-top:10px}
.grab{width:36px;height:4px;border-radius:2px;background:var(--borde);margin:0 auto 10px}

/* hero de detalle */
.hero{position:relative}
.hero img{width:100%;aspect-ratio:4/3;object-fit:cover}
.hero.short img{aspect-ratio:16/10}
.hero .bar{position:absolute;top:0;left:0;right:0;padding-top:12px}
.hero .ph-empty{aspect-ratio:4/3;height:auto}
.block{margin:14px 20px 0;padding:14px 16px;border-radius:var(--r);background:var(--lino)}
.block.line{background:none;border:1px solid var(--borde)}
.block ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 20px 0}
.fact{background:var(--lino);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-size:15px}
.who{display:flex;gap:12px;align-items:center;margin-top:10px}
.who .face{width:42px;height:42px;border-radius:50%;background:var(--verde);color:var(--crema);display:grid;place-items:center;font-family:var(--serif);font-size:20px;flex:none}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 20px}
.thumbs button{border:0;padding:0;background:none;text-align:left;min-width:0;display:grid;gap:4px;font-size:12px}
.thumbs .ph{aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--lino)}
.thumbs img{width:100%;height:100%;object-fit:cover}

/* reparto del precio */
.split{margin:14px 20px 0;padding:14px 16px;border-radius:var(--r);background:var(--salvia);color:var(--verde-osc)}
.split .meter{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0 10px;background:var(--crema)}
.split .meter i{display:block;height:100%}
.split .rows{display:grid;gap:4px;font-size:13px}
.split .rows div{display:flex;justify-content:space-between;gap:10px}
.split .rows .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.split .fine{font-size:11.5px;margin-top:8px;opacity:.85}

/* barra de acción y pestañas */
.action{display:flex;gap:10px;align-items:center;padding:12px 20px;border-top:1px solid var(--borde);background:var(--crema)}
.dark .action{background:var(--noche);border-color:var(--noche-3)}
.btn{flex:1;border:0;border-radius:12px;background:var(--verde-osc);color:var(--crema);padding:14px 16px;font-weight:600;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.light{background:var(--brote);color:var(--noche)}
.btn.ghost{background:none;border:1px solid var(--borde);color:var(--tinta)}
.dark .btn.ghost{border-color:var(--noche-3);color:var(--noche-txt)}
.stepper{display:flex;align-items:center;border:1px solid var(--borde);border-radius:12px;flex:none}
.stepper button{border:0;background:none;width:38px;height:46px;font-size:18px}
.stepper span{min-width:22px;text-align:center;font-weight:600}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--borde);background:var(--crema)}
.tabs.three{grid-template-columns:repeat(3,1fr)}
.dark .tabs{background:var(--noche);border-color:var(--noche-3)}
.tab{border:0;background:none;padding:9px 0 10px;display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--piedra);position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--verde-osc);font-weight:600}
.dark .tab{color:var(--noche-mute)}
.dark .tab[aria-current="page"]{color:var(--brote)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--tierra);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* pedido */
.items{display:grid;padding:0 20px}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--borde)}
.item .th{width:52px;height:52px;border-radius:10px;overflow:hidden;flex:none;background:var(--lino)}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .tx{flex:1;min-width:0}
.item .tx b{font-size:14px;display:block}
.item .stepper button{height:34px;width:32px;font-size:16px}
.item .stepper{border-radius:9px}
.pay{display:grid;gap:8px;padding:0 20px}
.radio{display:flex;gap:12px;align-items:center;border:1px solid var(--borde);border-radius:12px;padding:13px 14px;background:none;text-align:left;width:100%}
.radio i{width:20px;height:20px;border-radius:50%;border:2px solid var(--borde);flex:none}
.radio[aria-checked="true"]{border-color:var(--verde)}
.radio[aria-checked="true"] i{border:6px solid var(--verde)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px 0}
.total b{font-size:22px}

/* confirmación */
.done{padding:40px 24px 10px;display:grid;gap:14px;justify-items:start}
.done .ok{width:58px;height:58px;border-radius:50%;background:var(--salvia);display:grid;place-items:center;color:var(--verde-osc)}
.done .ok svg{width:30px;height:30px}

/* panel productor */
.dark .cardd{background:var(--noche-2);border-radius:var(--r);padding:14px 16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}
.stats b{display:block;font-size:22px;margin-top:2px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--noche-3)}
.toggle-row:first-of-type{border-top:0}
.switch{width:48px;height:28px;border-radius:14px;border:0;background:var(--noche-3);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#8F897C;transition:transform .15s,background .15s}
.switch[aria-checked="true"]{background:#7E9A57}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:#F4F1E8}
.notice{display:flex;gap:12px;align-items:center;background:var(--noche-2);border-radius:var(--r);padding:12px 14px;border:0;width:100%;text-align:left;color:inherit}
.notice .ic{width:42px;height:42px;border-radius:8px;flex:none;background:repeating-linear-gradient(135deg,var(--noche-3) 0 5px,#4A453C 5px 10px)}
.notice.okn .ic{background:#3E4A33}
.status{white-space:nowrap;flex:none;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:4px 8px;border-radius:4px;background:#3E4A33;color:var(--brote)}
.status.wait{background:#4A3A2C;color:var(--hoja)}
.orow{display:grid;gap:6px;padding:14px 0;border-top:1px solid var(--noche-3)}
.orow:first-child{border-top:0}
.orow .h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn-s{border:1px solid var(--noche-3);background:none;color:var(--noche-txt);border-radius:9px;padding:7px 12px;font-size:13px;justify-self:start}

/* perfil */
.menu{display:grid;margin:8px 20px 0;border-radius:var(--r);background:var(--lino);overflow:hidden}
.menu > button,.menu > div.mi{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:0;background:none;text-align:left;border-top:1px solid var(--borde);width:100%}
.menu > :first-child{border-top:0}
.dark .menu{background:var(--noche-2)}
.dark .menu > button,.dark .menu > div.mi{border-color:var(--noche-3)}
.note{margin:18px 20px 0;font-size:12.5px;color:var(--piedra);line-height:1.5}
.dark .note{color:var(--noche-mute)}

/* hoja modal */
.scrim{position:absolute;inset:0;background:rgba(20,18,14,.45);z-index:20;display:flex;align-items:flex-end}
.modal{background:var(--crema);color:var(--tinta);width:100%;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:10px 20px 20px;display:grid;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--borde);background:#fff;border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.field .hint{font-size:12px;color:var(--piedra)}
.field .err{font-size:12px;color:#A33A22}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-drop{display:flex;gap:12px;align-items:center;border:1px dashed var(--piedra);border-radius:12px;padding:10px;cursor:pointer}
.photo-drop .pv{width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--lino);flex:none;display:grid;place-items:center;color:var(--piedra)}
.photo-drop .pv img{width:100%;height:100%;object-fit:cover}
.preview-split{background:var(--salvia);color:var(--verde-osc);border-radius:12px;padding:10px 12px;font-size:13px}

.modal .btn.ghost{color:var(--tinta);border-color:var(--borde)}
.modal .mute{color:var(--piedra)}

/* toast */
.toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);background:var(--tinta);color:var(--crema);padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:30;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;animation:fade .2s ease-out}
.dark .toast{background:var(--brote);color:var(--noche)}
@keyframes fade{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* bienvenida */
.welcome{position:absolute;inset:0;z-index:40;background:var(--verde);color:var(--crema);display:flex;flex-direction:column;justify-content:space-between;padding:36px 28px 28px}
.welcome h1{font-size:46px;line-height:.98;margin-top:28px}
.welcome .lead{color:#DCE6CC;font-size:16px;margin-top:14px;max-width:30ch}
.brand{display:flex;align-items:center;gap:10px}
.brand .wm{font-family:var(--serif);font-size:28px;line-height:1}
.brand .tag{font-size:10px;letter-spacing:.3em;text-transform:uppercase;opacity:.8;margin-top:3px}
.role-pick{display:grid;gap:10px}
.role-pick button{border:0;border-radius:14px;padding:16px 18px;text-align:left;display:grid;gap:2px;background:var(--crema);color:var(--tinta)}
.role-pick button.alt{background:var(--noche);color:var(--noche-txt)}
.role-pick b{font-size:16px}
.role-pick span{font-size:13px;opacity:.75}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

var KEY = 'raiz-proto-v1';
var S = load() || fresh();
function fresh(){
  return {role:null, cart:{}, avail:{}, stock:{}, extra:[], photos:{}, orders:[], incoming:SAMPLE_ORDERS.slice(), pay:'debito',
          filter:'todos', q:'', salesBase:412300, ordersBase:27};
}
function load(){ try{ var s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function products(){ return BASE_PRODUCTS.concat(S.extra); }
function prod(id){ return products().filter(function(p){return p.id===id;})[0]; }
function producer(id){ return PRODUCERS.filter(function(p){return p.id===id;})[0]; }
function stockOf(p){ return S.stock[p.id]!=null ? S.stock[p.id] : p.stock; }
function photoOf(p){ return S.photos[p.id] || (p.img ? (IMG[p.img]||p.img) : null); }
function isOn(p){ var v=S.avail[p.id]; if(v==null) v=!p.off; return v && stockOf(p)>0 && !!photoOf(p); }
function visible(){ return products().filter(isOn); }

/* ---------- utilidades ---------- */
function clp(n){ return '$' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function consumerPrice(b){ return Math.round(b*(1+FEE)/10)*10; }
function toProducer(price){ return Math.round(price/(1+FEE)*(1-FEE)); }   // lo que llega al productor
function raizCut(price){ return price - toProducer(price); }
function cartCount(){ var n=0; for(var k in S.cart) n+=S.cart[k]; return n; }
function initials(name){ return name.split(' ').map(function(w){return w[0];}).slice(0,2).join(''); }
function thumb(p, cls){
  var src = photoOf(p);
  return src ? '<img src="'+src+'" alt="'+esc(p.name)+'"'+(cls?' class="'+cls+'"':'')+'>' :
    '<div class="ph-empty">'+SPROUT+'<span>Sin foto</span></div>';
}
function prodImg(pr){ var k = pr.img; return k ? IMG[k] : null; }
function prThumb(pr){ var s=prodImg(pr); return s?'<img src="'+s+'" alt="">':'<div class="ph-empty" style="font-size:0">'+SPROUT+'</div>'; }
function seals(pr){
  var h='';
  if(pr.verified) h+='<span class="seal">Origen verificado</span>'; else h+='<span class="seal pend">Verificación en curso</span>';
  if(pr.intercultural) h+='<span class="seal ic">Sello intercultural</span>';
  return '<div class="seals">'+h+'</div>';
}
var toastT;
function toast(msg){
  var old=document.querySelector('.toast'); if(old) old.remove();
  var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg;
  document.getElementById('app').appendChild(t);
  clearTimeout(toastT); toastT=setTimeout(function(){ t.remove(); },2400);
}

/* ---------- navegación ----------
   En el APK el botón atrás de Android lo maneja el plugin App de Capacitor;
   en el navegador se usa el historial. */
var CAP = window.Capacitor;
var NATIVE = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
var stack=[{s:'home'}], modalPushed=false, ignorePop=false;
function cur(){ return stack[stack.length-1]; }
function go(s, params){
  var e={s:s}; for(var k in params) e[k]=params[k];
  stack.push(e);
  if(!NATIVE){ try{ history.pushState({d:stack.length},''); }catch(err){} }
  render(true);
}
function popScreen(){ if(stack.length>1){ stack.pop(); render(true); } }
function back(){
  if(stack.length<2) return;
  if(NATIVE){ popScreen(); return; }
  try{ history.back(); }catch(e){ popScreen(); }
}
window.addEventListener('popstate',function(){
  if(ignorePop){ ignorePop=false; return; }
  if(document.querySelector('.scrim')){ modalPushed=false; closeModal(true); return; }
  popScreen();
});
if(NATIVE && CAP.Plugins && CAP.Plugins.App){
  CAP.Plugins.App.addListener('backButton',function(){
    if(document.querySelector('.scrim')){ closeModal(true); return; }
    if(stack.length>1){ popScreen(); return; }
    var home = S.role==='productor'?'panel':'home';
    if(S.role && stack[0].s!==home){ tab(home); return; }
    CAP.Plugins.App.exitApp();
  });
}
function tab(s){ stack=[{s:s}]; render(true); }

/* ---------- render ---------- */
var view=document.getElementById('view'), bottom=document.getElementById('bottom'), app=document.getElementById('app');
var scrollMem={};
function render(newScreen){
  var c=cur();
  var dark = S.role==='productor';
  app.classList.toggle('dark', dark);
  var key = c.s+(c.id||'');
  if(!newScreen) scrollMem[key]=view.scrollTop;
  var R = SCREENS[c.s] || SCREENS.home;
  var out = R(c);
  view.innerHTML = out.html;
  bottom.innerHTML = out.bottom!=null ? out.bottom : tabsHtml();
  view.scrollTop = newScreen ? 0 : (scrollMem[key]||0);
  if(out.after) out.after();
  if(!S.role) welcome();
  barStyle(dark || !S.role);
}
function barStyle(darkTop){
  // íconos de la barra de estado claros sobre fondo oscuro/verde, oscuros sobre crema
  if(!NATIVE || !CAP.Plugins || !CAP.Plugins.SystemBars) return;
  try{ var r=CAP.Plugins.SystemBars.setStyle({style: darkTop?'DARK':'LIGHT'}); if(r&&r.catch) r.catch(function(){}); }catch(e){}
}
function rerender(){ var y=view.scrollTop; render(false); view.scrollTop=y; }

function tabsHtml(){
  var c=stack[0].s;
  if(S.role==='productor'){
    var pend=S.incoming.filter(function(o){return o.status==='pend';}).length;
    return '<nav class="tabs three" aria-label="Secciones">'+
      t('panel','Panel',ICON.panel)+t('orders','Pedidos',ICON.box,pend)+t('profile','Perfil',ICON.user)+'</nav>';
  }
  return '<nav class="tabs" aria-label="Secciones">'+
    t('home','Descubrir',ICON.home)+t('map','Mapa',ICON.map)+t('cart','Pedido',ICON.bag,cartCount())+t('profile','Perfil',ICON.user)+'</nav>';
  function t(s,label,icon,badge){
    return '<button class="tab" data-tab="'+s+'"'+(c===s?' aria-current="page"':'')+'>'+icon+'<span>'+label+'</span>'+
      (badge?'<span class="badge num">'+badge+'</span>':'')+'</button>';
  }
}
function backBar(extra){ return '<div class="bar"><button class="iconbtn" data-act="back" aria-label="Volver">'+ICON.back+'</button>'+(extra||'')+'</div>'; }

var SCREENS = {};

/* 01 Descubrir */
SCREENS.home = function(){
  var list = visible();
  var q = S.q.trim().toLowerCase();
  var f = S.filter;
  var prs = PRODUCERS.filter(function(pr){
    if(f==='verificados' && !pr.verified) return false;
    if(f==='cerca' && pr.km>20) return false;
    if(f==='coop' && pr.type!=='coop') return false;
    return true;
  });
  var ids = prs.map(function(p){return p.id;});
  list = list.filter(function(p){
    if(ids.indexOf(p.pid)<0) return false;
    if(!q) return true;
    var pr=producer(p.pid);
    return (p.name+' '+p.cat+' '+pr.name+' '+pr.cats).toLowerCase().indexOf(q)>=0;
  });
  var feat = producer('trawun');
  var chips = [['todos','Todo'],['verificados','Verificados'],['cerca','Cerca de ti'],['coop','Cooperativas']].map(function(c){
    return '<button class="chip" data-filter="'+c[0]+'" aria-pressed="'+(f===c[0])+'">'+c[1]+'</button>';
  }).join('');
  var showFeat = !q && ids.indexOf('trawun')>=0;
  var h = '<header class="top"><div><div class="eyebrow">Región de Los Lagos · Puyehue</div><h1>Hola, Camila</h1></div>'+
    '<button class="avatar" data-tab="profile" aria-label="Perfil">CS</button></header>'+
    '<label class="search">'+ICON.search+'<input id="q" type="search" placeholder="Buscar miel, lana, hortalizas…" value="'+esc(S.q)+'" autocomplete="off" aria-label="Buscar"></label>'+
    '<div class="chips" role="group" aria-label="Filtros">'+chips+'</div>'+
    (showFeat ? '<button class="feature" data-producer="trawun"><img src="'+IMG.farmer+'" alt="Socias de la Cooperativa Trawün en la huerta">'+
      '<div class="body"><div class="meta">'+(feat.intercultural?'<span class="seal ic">Sello intercultural</span>':'')+'<span class="xs mute">a '+feat.km+' km</span></div>'+
      '<h3>'+feat.name+'</h3><p class="small mute">'+feat.desc+'</p></div></button>' : '')+
    '<div class="sechead"><h3>'+(q?'Resultados':'Disponible hoy')+'</h3><span class="xs mute num">'+list.length+' productos</span></div>';
  if(list.length){
    h += '<div class="grid2">'+list.map(pcard).join('')+'</div>';
  } else {
    h += '<div class="empty"><h3>Nada por aquí todavía</h3><p class="small mute">Prueba otra palabra o quita el filtro. La oferta cambia cada día según lo que publican los productores.</p></div>';
  }
  return {html:h, after:function(){
    var inp=document.getElementById('q');
    inp.addEventListener('input',function(){ S.q=inp.value; save(); var pos=inp.selectionStart; rerender(); var n=document.getElementById('q'); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} });
  }};
};
function pcard(p){
  var pr=producer(p.pid);
  return '<button class="pcard" data-product="'+p.id+'"><div class="ph">'+thumb(p)+'</div>'+
    '<div><div class="nm">'+esc(p.name)+' <span class="mute" style="font-weight:400">'+esc(p.unit)+'</span></div>'+
    '<div class="pr num">'+clp(p.price)+' <span class="mute">· '+pr.short+'</span></div></div></button>';
}

/* 02 Mapa regional */
var mapSel=null, mapCat='todos';
SCREENS.map = function(){
  var cats=[['todos','Todo'],['Miel','Miel'],['Lana','Lana'],['Hortalizas','Hortalizas'],['Frutas','Frutas']];
  function match(pr){
    if(mapCat==='todos') return true;
    return visible().some(function(p){return p.pid===pr.id && p.cat===mapCat;});
  }
  var prs = PRODUCERS.slice().sort(function(a,b){return a.km-b.km;});
  var shown = prs.filter(match);
  var pins = PRODUCERS.map(function(pr){
    return '<button class="pin'+(pr.type==='coop'?' coop':'')+(mapSel===pr.id?' sel':'')+(match(pr)?'':' dim')+'" style="left:'+pr.x+'%;top:'+pr.y+'%" data-pin="'+pr.id+'" aria-label="'+esc(pr.name)+'"><i></i></button>';
  }).join('');
  var h = '<div class="map">'+mapSvg()+pins+'<span class="me" style="left:56%;top:44%" title="Estás aquí"></span>'+
    '<div class="mapsearch"><div>Puyehue y alrededores · 40 km</div></div>'+
    '<div class="legend"><span><i></i>Productor</span><span><i class="c"></i>Cooperativa</span></div></div>'+
    '<div class="sheet-top"><div class="grab"></div>'+
    '<div class="pad" style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><h3><span class="num">'+shown.length+'</span> productores cerca</h3><span class="xs mute">por distancia</span></div>'+
    '<div class="chips" style="padding-top:10px;padding-bottom:8px">'+cats.map(function(c){return '<button class="chip" data-mapcat="'+c[0]+'" aria-pressed="'+(mapCat===c[0])+'">'+c[1]+'</button>';}).join('')+'</div>'+
    '<div class="plist">'+shown.map(function(pr){
      return '<div class="prow'+(mapSel===pr.id?' sel':'')+'" id="row-'+pr.id+'"><div class="th">'+prThumb(pr)+'</div>'+
        '<div class="tx"><b>'+pr.name+'</b><span class="xs mute">'+pr.cats+' · <span class="num">'+pr.km+'</span> km</span><br><span class="xs '+(pr.verified?'':'mute')+'" style="color:'+(pr.verified?'var(--verde)':'')+'">'+(pr.verified?'Verificado por '+pr.verifiedBy:'Verificación en curso')+'</span></div>'+

/* 04 Producto y origen */
var qty=1;
SCREENS.product = function(c){
  var p=prod(c.id), pr=producer(p.pid);
  var stock=stockOf(p), inCart=S.cart[p.id]||0;
  var maxQ=Math.max(0,stock-inCart); if(qty>maxQ) qty=Math.max(1,maxQ);
  var toP=toProducer(p.price), cut=raizCut(p.price);
  var feeC = p.price - Math.round(p.price/(1+FEE));
  var pct = Math.round(toP/p.price*100);
  var src=photoOf(p);
  var h = '<div class="hero">'+(src?'<img src="'+src+'" alt="'+esc(p.name)+'">':'<div class="ph-empty">'+SPROUT+'</div>')+backBar()+'</div>'+
    '<div class="pad" style="padding-top:16px;display:grid;gap:4px">'+
      '<button class="link" data-producer="'+pr.id+'" style="justify-self:start;color:var(--piedra);font-weight:500">'+pr.name+' · '+pr.place+' ›</button>'+
      '<h2>'+esc(p.name)+' <span class="mute">'+esc(p.unit)+'</span></h2>'+
      '<p><b style="font-size:22px" class="num">'+clp(p.price)+'</b> <span class="small" style="color:var(--verde)">'+clp(toP)+' van al productor</span></p></div>'+
    '<div class="split" aria-label="Reparto del precio"><b class="small">Así se reparte lo que pagas</b>'+
      '<div class="meter"><i style="width:'+pct+'%;background:var(--verde)"></i><i style="width:'+(100-pct)+'%;background:var(--hoja)"></i></div>'+
      '<div class="rows num"><div><span><span class="dot" style="background:var(--verde)"></span>Al productor</span><b>'+clp(toP)+' · '+pct+'%</b></div>'+
      '<div><span><span class="dot" style="background:var(--hoja)"></span>Comisión Raíz (8%)</span><b>'+clp(cut)+'</b></div></div>'+
      '<p class="fine">La comisión se reparte: '+clp(feeC)+' van incluidos en tu precio y '+clp(cut-feeC)+' los asume el productor. Sin intermediarios.</p></div>'+
    '<div class="block line"><b class="small">¿Quién lo produce?</b><div class="who"><div class="face">'+initials(p.who.name)+'</div><div><b class="small">'+esc(p.who.name)+'</b><div class="xs mute">'+esc(p.who.role)+'</div></div></div>'+
      '<p class="small" style="margin-top:10px">'+esc(p.story)+'</p></div>'+
    '<div class="facts"><div class="fact"><span class="xs mute">Stock</span><b class="num">'+stock+' '+(stock===1?'unidad':'unidades')+'</b></div>'+
      '<div class="fact"><span class="xs mute">Entrega</span><b>'+esc(p.ship)+'</b></div></div>'+
    '<div class="pad" style="margin-top:14px">'+seals(pr)+'</div>';
  var can = maxQ>0;
  var bot = '<div class="action"><div class="stepper" role="group" aria-label="Cantidad"><button data-qty="-1" aria-label="Menos">−</button><span class="num" aria-live="polite">'+(can?qty:0)+'</span><button data-qty="1" aria-label="Más">+</button></div>'+
    '<button class="btn" data-add="'+p.id+'"'+(can?'':' disabled')+'>'+(can?'Agregar al pedido':'Ya tienes todo el stock')+'</button></div>';
  return {html:h, bottom:bot};
};

/* 05 Pedido y pago */
function cartTotals(){
  var sub=0, toP=0, lines=[];
  for(var id in S.cart){ var p=prod(id); if(!p) continue; var q=S.cart[id]; sub+=p.price*q; toP+=toProducer(p.price)*q; lines.push([p,q]); }
  var ship = lines.length?SHIPPING:0;
  return {lines:lines, sub:sub, toP:toP, cut:sub-toP, ship:ship, total:sub+ship};
}
SCREENS.cart = function(){
  var T=cartTotals();
  var h='<header class="top"><div><div class="eyebrow">Compra directa</div><h1>Tu pedido</h1></div></header>';
  if(!T.lines.length){
    h+='<div class="empty"><h3>Tu pedido está vacío</h3><p class="small mute">Agrega productos desde Descubrir o el mapa. Verás cuánto llega a cada productor antes de pagar.</p><button class="btn" data-tab="home" style="margin-top:6px">Descubrir productos</button></div>';
    return {html:h};
  }
  h+='<div class="items">'+T.lines.map(function(l){var p=l[0],q=l[1],pr=producer(p.pid);
    return '<div class="item"><div class="th">'+thumb(p)+'</div><div class="tx"><b>'+esc(p.name)+' '+esc(p.unit)+'</b><span class="xs mute">'+pr.short+' · '+clp(toProducer(p.price)*q)+' al productor</span><div class="small num" style="margin-top:2px">'+clp(p.price*q)+'</div></div>'+
      '<div class="stepper"><button data-cq="'+p.id+'" data-d="-1" aria-label="Quitar uno">−</button><span class="num">'+q+'</span><button data-cq="'+p.id+'" data-d="1" aria-label="Agregar uno">+</button></div></div>';
  }).join('')+'</div>'+
  '<div class="split"><b class="small">Comercio justo, a la vista</b>'+
    '<div class="rows num" style="margin-top:8px"><div><span>A los productores</span><b>'+clp(T.toP)+'</b></div><div><span>Comisión Raíz (8%)</span><b>'+clp(T.cut)+'</b></div><div><span>Envío regional</span><b>'+clp(T.ship)+'</b></div></div></div>'+
  '<div class="sechead" style="padding-top:20px"><h3>Pago</h3></div>'+
  '<div class="pay" role="radiogroup" aria-label="Medio de pago">'+[['debito','Débito / crédito','Pago seguro, directo al productor'],['transferencia','Transferencia','Te enviamos los datos al confirmar']].map(function(o){
    return '<button class="radio" role="radio" aria-checked="'+(S.pay===o[0])+'" data-pay="'+o[0]+'"><i></i><span><b class="small">'+o[1]+'</b><br><span class="xs mute">'+o[2]+'</span></span></button>';}).join('')+'</div>'+
  '<div class="total"><span class="mute">Total</span><b class="num">'+clp(T.total)+'</b></div>';
  return {html:h, bottom:'<div class="action"><button class="btn" data-act="pay">Pagar pedido · '+clp(T.total)+'</button></div>'+tabsHtml()};
};
SCREENS.done = function(c){
  var o=S.orders.filter(function(x){return x.id===c.id;})[0];
  var h='<div class="done"><div class="ok">'+ICON.check+'</div><div class="eyebrow">Pedido '+o.id+'</div><h1>Pedido confirmado</h1>'+
    '<p class="mute">'+clp(o.toP)+' llegan directo a '+(o.producers.length===1?'1 productor':o.producers.length+' productores')+'. Te avisaremos cuando despachen.</p></div>'+
    '<div class="items">'+o.items.map(function(it){var p=prod(it[0]);return '<div class="item"><div class="th">'+thumb(p)+'</div><div class="tx"><b>'+esc(p.name)+'</b><span class="xs mute">'+it[1]+' × '+clp(p.price)+' · entrega '+esc(p.ship)+'</span></div></div>';}).join('')+'</div>'+
    '<div class="total"><span class="mute">Pagado con '+(o.pay==='debito'?'débito / crédito':'transferencia')+'</span><b class="num">'+clp(o.total)+'</b></div>';
  return {html:h, bottom:'<div class="action"><button class="btn" data-tab="home">Seguir explorando</button></div>'+tabsHtml()};
};

/* Perfil */
SCREENS.profile = function(){
  var prodMode = S.role==='productor';
  var h='<header class="top"><div><div class="eyebrow">'+(prodMode?'Modo productor':'Consumidora')+'</div><h1>'+(prodMode?'Cooperativa Trawün':'Camila Soto')+'</h1></div></header>'+
    '<div class="menu">'+
      '<div class="mi"><span>'+(prodMode?'Usar Raíz como consumidora':'Cambiar a modo productor')+'</span><button class="switch" role="switch" aria-checked="'+prodMode+'" data-act="role" aria-label="Modo productor"></button></div>'+
      (prodMode?'':'<div class="mi"><span>Pedidos realizados</span><b class="num">'+S.orders.length+'</b></div>')+
      '<div class="mi"><span>Región</span><span class="mute">Los Lagos · Puyehue</span></div>'+
    '</div>'+
    (!prodMode && S.orders.length ? '<div class="sechead"><h3>Tus pedidos</h3></div><div class="items">'+S.orders.slice().reverse().map(function(o){
      return '<div class="item"><div class="tx"><b>'+o.id+' · '+o.items.length+' producto'+(o.items.length>1?'s':'')+'</b><span class="xs mute">'+clp(o.toP)+' a productores · '+o.date+'</span></div><b class="num small">'+clp(o.total)+'</b></div>';}).join('')+'</div>' : '')+
    '<div class="menu" style="margin-top:18px"><button data-act="reset"><span>Restablecer datos de ejemplo</span><span class="mute">›</span></button></div>'+
    '<p class="note">Prototipo de Raíz del Territorio para el piloto. Productores, productos y pedidos son datos de ejemplo; los pagos no se procesan. Lo que cambias se guarda solo en este teléfono.</p>';
  return {html:h};
};

/* 06 Panel del productor */
SCREENS.panel = function(){
  var mine = products().filter(function(p){return p.pid===ME;});
  var sales = S.salesBase, n=S.ordersBase;
  S.incoming.forEach(function(o){ if(o.mine){ sales+=o.toP; n++; } });
  var notices = [];
  mine.forEach(function(p){
    if(!photoOf(p)) notices.push({id:p.id, t:'Faltan fotos', d:'Sube 1 foto de tus '+p.name.toLowerCase()+' para publicarlas.'});
    else if(stockOf(p)===0) notices.push({id:p.id, t:'Sin stock', d:'Actualiza el stock de '+p.name.toLowerCase()+' para que vuelva a aparecer.'});
  });
  var h='<header class="top"><div><div class="eyebrow">Modo productor</div><h1>Trawün</h1></div><span class="status">Activo</span></header>'+
    '<div class="stats"><div class="cardd"><span class="xs mute">Ventas del mes</span><b class="num">'+clp(sales)+'</b></div><div class="cardd"><span class="xs mute">Pedidos</span><b class="num">'+n+'</b></div></div>'+
    '<div class="pad" style="margin-top:12px"><div class="cardd"><b class="small">Disponibilidad de hoy</b><p class="xs mute" style="margin:2px 0 6px">Lo que actives aparece al instante para los consumidores.</p>'+
      mine.map(function(p){
        var v=S.avail[p.id]; if(v==null) v=!p.off;
        var st=stockOf(p); var on = v && st>0 && !!photoOf(p);
        return '<div class="toggle-row"><div style="min-width:0"><span class="small">'+esc(p.name)+' · <span class="num">'+st+'</span></span><br><span class="xs mute">'+(on?'Visible':(!photoOf(p)?'Falta foto':(st===0?'Sin stock':'Oculto')))+'</span></div>'+
          '<div style="display:flex;gap:8px;align-items:center"><button class="btn-s" data-edit="'+p.id+'">Editar</button><button class="switch" role="switch" aria-checked="'+on+'" data-avail="'+p.id+'" aria-label="Disponible: '+esc(p.name)+'"></button></div></div>';
      }).join('')+'</div></div>'+
    '<div class="pad" style="margin-top:12px;display:grid;gap:10px">'+
      (notices.length? notices.map(function(x){return '<button class="notice" data-edit="'+x.id+'"><span class="ic"></span><span><b class="small">'+x.t+'</b><br><span class="xs mute">'+esc(x.d)+'</span></span></button>';}).join('')
       : '<div class="notice okn"><span class="ic"></span><span><b class="small">Todo al día</b><br><span class="xs mute">Tus productos tienen foto y stock.</span></span></div>')+
    '</div>'+
    '<p class="note">Consejo: los productos con historia de producción y dos fotos venden más. Puedes editar cada ficha desde “Editar”.</p>';
  return {html:h, bottom:'<div class="action"><button class="btn light" data-act="publish">Publicar producto</button></div>'+tabsHtml()};
};
SCREENS.orders = function(){
  var list=S.incoming;
  var h='<header class="top"><div><div class="eyebrow">Modo productor</div><h1>Pedidos</h1></div></header>'+
   '<div class="pad"><div class="cardd">'+(list.length?list.map(function(o){
     var tot=0; var names=o.items.map(function(it){var p=prod(it[0]); tot+=toProducer(p.price)*it[1]; return it[1]+' × '+p.name;}).join(', ');
     return '<div class="orow"><div class="h"><b class="small">'+o.id+' · '+esc(o.who)+'</b><span class="status'+(o.status==='pend'?' wait':'')+'">'+(o.status==='pend'?'Por despachar':'Despachado')+'</span></div>'+
       '<span class="small">'+esc(names)+'</span><span class="xs mute num">Recibes '+clp(tot)+' · '+o.date+'</span>'+
       (o.status==='pend'?'<button class="btn-s" data-ship="'+o.id+'">Marcar como despachado</button>':'')+'</div>';
   }).join(''):'<p class="small mute">Aún no tienes pedidos.</p>')+'</div></div>';
  return {html:h};
};

/* ---------- hoja: publicar / editar producto ---------- */
var draftPhoto=null;
function openEditor(id){
  var p = id ? prod(id) : null;
  draftPhoto = p ? (S.photos[p.id]||null) : null;
  var base = p ? Math.round(p.price/(1+FEE)) : '';
  var cats=['Miel','Hortalizas','Lana','Frutas','Lácteos','Hierbas','Despensa'];
  var cur = p ? photoOf(p) : null;
  var html='<div class="scrim" data-act="close"><form class="modal" id="ed" novalidate aria-label="'+(p?'Editar producto':'Publicar producto')+'">'+
    '<div class="grab"></div><h2>'+(p?'Editar '+esc(p.name.toLowerCase()):'Publicar producto')+'</h2>'+
    '<label class="photo-drop" for="f-photo"><span class="pv" id="pv">'+(cur?'<img src="'+cur+'" alt="">':ICON.cam)+'</span><span><b class="small">'+(cur?'Cambiar foto':'Agregar foto')+'</b><br><span class="xs mute">Una foto clara del producto, con luz natural.</span></span></label>'+
    '<input id="f-photo" type="file" accept="image/*" hidden>'+
    '<div class="field"><label for="f-name">Nombre</label><input id="f-name" value="'+esc(p?p.name:'')+'" placeholder="Ej: Mermelada de maqui" maxlength="40"></div>'+
    '<div class="row2"><div class="field"><label for="f-unit">Formato</label><input id="f-unit" value="'+esc(p?p.unit:'')+'" placeholder="Ej: 350 g" maxlength="16"></div>'+
      '<div class="field"><label for="f-cat">Categoría</label><select id="f-cat">'+cats.map(function(c){return '<option'+(p&&p.cat===c?' selected':'')+'>'+c+'</option>';}).join('')+'</select></div></div>'+
    '<div class="row2"><div class="field"><label for="f-price">Tu precio ($)</label><input id="f-price" inputmode="numeric" value="'+base+'" placeholder="Ej: 4500"></div>'+
      '<div class="field"><label for="f-stock">Stock</label><input id="f-stock" inputmode="numeric" value="'+(p?stockOf(p):'')+'" placeholder="Ej: 10"></div></div>'+
    '<div class="preview-split num" id="pvs"></div>'+
    '<div class="field"><label for="f-story">Cómo lo produces</label><textarea id="f-story" maxlength="240" placeholder="Dónde, cuándo y cómo se hace. Esto es lo que más valoran los consumidores.">'+esc(p?p.story:'')+'</textarea></div>'+
    '<p class="field"><span class="err" id="ed-err" role="alert"></span></p>'+
    '<div style="display:flex;gap:10px"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button type="submit" class="btn">'+(p?'Guardar cambios':'Publicar')+'</button></div>'+
    '</form></div>';
  app.insertAdjacentHTML('beforeend', html);
  if(!NATIVE){ try{ history.pushState({m:1},''); modalPushed=true; }catch(e){} }
  var f=document.getElementById('ed');
  function upd(){
    var b=parseInt(document.getElementById('f-price').value.replace(/\D/g,''),10);
    var el=document.getElementById('pvs');
    if(b>0){ var cp=consumerPrice(b); el.innerHTML='El consumidor verá <b>'+clp(cp)+'</b> y tú recibes <b>'+clp(toProducer(cp))+'</b>. La comisión de 8% se reparte mitad y mitad.'; }
    else el.textContent='Escribe tu precio y verás cuánto recibes y cuánto paga el consumidor.';
  }
  document.getElementById('f-price').addEventListener('input',upd); upd();
  document.getElementById('f-photo').addEventListener('change',function(e){
    var file=e.target.files&&e.target.files[0]; if(!file) return;
    var rd=new FileReader();
    rd.onload=function(){ var im=new Image(); im.onload=function(){
      var s=Math.min(1,700/Math.max(im.width,im.height)); var cv=document.createElement('canvas'); cv.width=Math.round(im.width*s); cv.height=Math.round(im.height*s);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); draftPhoto=cv.toDataURL('image/jpeg',0.78);
      document.getElementById('pv').innerHTML='<img src="'+draftPhoto+'" alt="">';
    }; im.src=rd.result; };
    rd.readAsDataURL(file);
  });
  f.addEventListener('click',function(e){ e.stopPropagation(); var c=e.target.closest('[data-act="close"]'); if(c && f.contains(c)) closeModal(); });
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var name=document.getElementById('f-name').value.trim(), unit=document.getElementById('f-unit').value.trim();
    var b=parseInt(document.getElementById('f-price').value.replace(/\D/g,''),10), st=parseInt(document.getElementById('f-stock').value.replace(/\D/g,''),10);
    var story=document.getElementById('f-story').value.trim(), cat=document.getElementById('f-cat').value;
    var err=document.getElementById('ed-err');
    if(!name){ err.textContent='Escribe el nombre del producto.'; return; }
    if(!unit){ err.textContent='Indica el formato, por ejemplo 500 g o 12 unidades.'; return; }
    if(!(b>=100)){ err.textContent='El precio debe ser de al menos $100.'; return; }
    if(isNaN(st)){ err.textContent='Indica cuántas unidades tienes (puede ser 0).'; return; }
    if(!draftPhoto && !(p&&photoOf(p))){ err.textContent='Agrega una foto. Sin foto el producto no se publica.'; return; }
    var price=consumerPrice(b);
    if(p){
      var isBase = BASE_PRODUCTS.indexOf(p)>=0;
      var target = isBase ? p : S.extra.filter(function(x){return x.id===p.id;})[0];
      target.name=name; target.unit=unit; target.price=price; target.cat=cat; target.story=story||target.story;
      if(isBase){ S.over=S.over||{}; S.over[p.id]={name:name,unit:unit,price:price,cat:cat,story:target.story}; }
      S.stock[p.id]=st; if(draftPhoto) S.photos[p.id]=draftPhoto; S.avail[p.id]=true;
      save(); closeModal(); rerender(); toast('Cambios guardados');
    } else {
      var id='u'+Date.now().toString(36);
      S.extra.push({id:id,pid:ME,name:name,unit:unit,price:price,img:null,stock:st,ship:'2–4 días',cat:cat,
        who:{name:'Cooperativa Trawün',role:'12 familias, Puyehue'}, story:story||'Producido por la Cooperativa Trawün en Puyehue.'});
      S.photos[id]=draftPhoto; S.avail[id]=true; save(); closeModal(); rerender(); toast('Producto publicado');
    }
  });
  setTimeout(function(){ var n=document.getElementById('f-name'); if(n && !p) n.focus(); },60);
}
function closeModal(fromPop){
  var s=document.querySelector('.scrim'); if(s) s.remove();
  if(!fromPop && modalPushed){ modalPushed=false; ignorePop=true; try{ history.back(); }catch(e){ ignorePop=false; } }
}
function applyOverrides(){ if(!S.over) return; BASE_PRODUCTS.forEach(function(p){ var o=S.over[p.id]; if(o) for(var k in o) p[k]=o[k]; }); }

/* ---------- bienvenida ---------- */
function welcome(){
  if(document.querySelector('.welcome')) return;
  app.insertAdjacentHTML('beforeend','<section class="welcome" aria-label="Bienvenida"><div>'+
    '<div class="brand"><span style="width:34px;height:34px;color:var(--crema)">'+SPROUT+'</span><div><div class="wm">Raíz</div><div class="tag">del territorio</div></div></div>'+
    '<h1>Comercio directo desde el territorio</h1><p class="lead">Compra a productores rurales verificados y mira cuánto de lo que pagas llega a ellos.</p></div>'+
    '<div class="role-pick"><button data-role="consumidor"><b>Quiero comprar</b><span>Descubre productores cerca de ti</span></button>'+
    '<button class="alt" data-role="productor"><b>Soy productor</b><span>Publica tus productos y recibe pedidos</span></button>'+
    '<p class="xs" style="opacity:.7;margin-top:6px">Prototipo para el piloto · datos de ejemplo</p></div></section>');
}

/* ---------- eventos ---------- */
app.addEventListener('click',function(e){
  var t=e.target.closest('button,[data-act]'); if(!t || t.closest('.modal')) return;
  var d=t.dataset;
  if(t.classList.contains('scrim') && e.target!==t) return;
  if(d.role){ S.role=d.role; save(); var w=document.querySelector('.welcome'); if(w) w.remove(); stack=[{s:d.role==='productor'?'panel':'home'}]; render(true); return; }
  if(d.tab){ tab(d.tab); return; }
  if(d.filter){ S.filter=d.filter; save(); rerender(); return; }
  if(d.mapcat){ mapCat=d.mapcat; rerender(); return; }
  if(d.pin){ mapSel=d.pin; mapCat='todos'; rerender(); var r=document.getElementById('row-'+d.pin); if(r) r.scrollIntoView({block:'nearest',behavior:'smooth'}); return; }
  if(d.producer){ go('producer',{id:d.producer}); return; }
  if(d.product){ qty=1; go('product',{id:d.product}); return; }
  if(d.qty){ var p=prod(cur().id); var mx=stockOf(p)-(S.cart[p.id]||0); qty=Math.max(1,Math.min(mx,qty+parseInt(d.qty,10))); rerender(); return; }
  if(d.add){ S.cart[d.add]=(S.cart[d.add]||0)+qty; save(); var pp=prod(d.add); toast(qty+' × '+pp.name+' en tu pedido'); qty=1; rerender(); return; }
  if(d.cq){ var p2=prod(d.cq); var nq=(S.cart[d.cq]||0)+parseInt(d.d,10); if(nq<=0) delete S.cart[d.cq]; else S.cart[d.cq]=Math.min(nq,stockOf(p2)); save(); rerender(); return; }
  if(d.pay){ S.pay=d.pay; save(); rerender(); return; }
  if(d.avail){ var p3=prod(d.avail);
    if(!photoOf(p3)){ openEditor(p3.id); return; }
    if(stockOf(p3)===0){ openEditor(p3.id); toast('Primero actualiza el stock'); return; }
    var on=t.getAttribute('aria-checked')==='true'; S.avail[d.avail]=!on; save(); rerender(); toast(!on?p3.name+' visible hoy':p3.name+' oculto'); return; }
  if(d.edit){ openEditor(d.edit); return; }
  if(d.ship){ S.incoming.forEach(function(o){ if(o.id===d.ship) o.status='done'; }); save(); rerender(); toast('Pedido '+d.ship+' despachado'); return; }
  switch(d.act){
    case 'back': back(); break;
    case 'catalog': go('catalog',{id:d.id}); break;
    case 'publish': openEditor(null); break;
    case 'close': if(e.target===t) closeModal(); break;
    case 'role': S.role = S.role==='productor'?'consumidor':'productor'; save(); stack=[{s:'profile'}]; render(true); toast(S.role==='productor'?'Modo productor activado':'Modo consumidora'); break;
    case 'reset': try{localStorage.removeItem(KEY);}catch(err){} location.reload(); break;
    case 'pay': checkout(); break;
  }
});
function checkout(){
  var T=cartTotals(); if(!T.lines.length) return;
  var num = 'R-'+(2615+S.orders.length);
  var prs=[];
  T.lines.forEach(function(l){ var p=l[0]; if(prs.indexOf(p.pid)<0) prs.push(p.pid); S.stock[p.id]=stockOf(p)-l[1]; });
  var o={id:num, items:T.lines.map(function(l){return [l[0].id,l[1]];}), total:T.total, toP:T.toP, pay:S.pay, producers:prs, date:'hoy'};
  S.orders.push(o);
  var mineItems=o.items.filter(function(it){return prod(it[0]).pid===ME;});
  if(mineItems.length){
    var tp=0; mineItems.forEach(function(it){ tp+=toProducer(prod(it[0]).price)*it[1]; });
    S.incoming.unshift({id:num, who:'Camila S. · Puyehue', items:mineItems, status:'pend', date:'hoy', mine:true, toP:tp});
  }
  S.cart={}; save();
  stack=[{s:'cart'}]; go('done',{id:num});
}

applyOverrides();
render(true);
})();
</script>
