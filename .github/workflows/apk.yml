name: Generar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk raiz.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: raiz-apk
          path: raiz.apk

      - name: Publicar en Releases (descarga directa desde el celular)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ultima-version --yes --cleanup-tag || true
          gh release create ultima-version raiz.apk \
            --title "Raíz · última versión" \
            --notes "APK de prueba generado automáticamente desde el commit ${GITHUB_SHA::7}. Descarga raiz.apk en tu Android e instálalo."
